name: SupplyChain-TLM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q src tests scripts
      - name: Check whitespace
        run: git diff --check
      - name: Report dataset coverage
        run: python -m src.supplychain_tlm.dataset_report examples/training_tasks_extended.jsonl --json
      - name: Run tests
        run: python -m unittest discover -s tests -v
